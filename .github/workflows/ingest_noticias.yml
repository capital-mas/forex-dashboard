name: Ingesta de noticias de mercado

on:
  schedule:
    # Una vez por hora, en el minuto :00.
    - cron: "0 * * * *"
  workflow_dispatch: {}  # para poder dispararlo a mano desde GitHub

jobs:
  ingestar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cachear pip y el modelo de embeddings
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/torch
            ~/.cache/huggingface
          key: ${{ runner.os }}-noticias-${{ hashFiles('requirements-noticias.txt') }}

      - name: Instalar dependencias
        run: pip install -r requirements-noticias.txt

      - name: Correr ingesta de noticias
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          # Opcionales — si no los definís como secrets, usa los
          # valores por defecto del script:
          # WATCHLIST: "AAPL,MSFT,GOOGL,YPF,GGAL"
          UMBRAL_SIMILITUD: "0.42"   # bajado desde el default 0.55 — estaba descartando todo
          VENTANA_MINUTOS: "90"   # 1.5 horas — un poco más que el intervalo, por si una corrida se demora o falla
        run: python ingest_noticias.py

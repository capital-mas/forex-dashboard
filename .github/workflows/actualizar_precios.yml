name: Actualizar precios de mercado

on:
  schedule:
    # Cada 20 minutos, de lunes a viernes (mercados abiertos aprox.)
    - cron: '*/20 13-21 * * 1-5'
  workflow_dispatch:  # te permite dispararlo manualmente desde GitHub también

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install yfinance pandas supabase

      - name: Ejecutar worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python workers/worker_actualizar_precios.py
